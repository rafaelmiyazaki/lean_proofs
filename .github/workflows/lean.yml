name: Lean verification
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lean-action requires a committed manifest. Generate it directly
      # from the pinned lean-toolchain and lakefile in this prototype.
      - name: Install elan
        run: |
          curl --retry 3 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve Lean and Mathlib dependencies
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build all formalization modules
        run: lake build
